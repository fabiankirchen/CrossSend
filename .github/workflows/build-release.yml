name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Run Android Lint
        run: ./gradlew lintRelease

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          mkdir -p app
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app/release.keystore"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets to app/release.keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tag push detected ($GITHUB_REF), but SIGNING_KEYSTORE_BASE64 secret is not configured!"
            echo "Generating a random or temporary keystore is strictly prohibited for releases to prevent INSTALL_FAILED_UPDATE_INCOMPATIBLE on app updates."
            echo "Please configure the following repository secrets under Settings -> Secrets and variables -> Actions:"
            echo "  - SIGNING_KEYSTORE_BASE64 (base64-encoded .keystore / .jks file)"
            echo "  - SIGNING_KEYSTORE_PASSWORD"
            echo "  - SIGNING_KEY_ALIAS"
            echo "  - SIGNING_KEY_PASSWORD"
            exit 1
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret provided on non-tag build ($GITHUB_REF)."
            echo "Falling back to debug signing config to verify release R8 shrinking build..."
          fi

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v') || secrets.SIGNING_KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease

      - name: Build Release APK (Verification with Debug Signing Fallback)
        if: "!startsWith(github.ref, 'refs/tags/v') && secrets.SIGNING_KEYSTORE_BASE64 == ''"
        run: ./gradlew assembleRelease -PallowDebugReleaseSigning=true

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="release"
          fi
          cp app/build/outputs/apk/release/app-release.apk CrossSend-release.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/CrossSend-${TAG_NAME}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/CrossSend.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CrossSend-release
          path: |
            CrossSend-release.apk
            release-artifacts/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CrossSend-release.apk
            release-artifacts/CrossSend-${{ github.ref_name }}.apk
            release-artifacts/CrossSend.apk
          generate_release_notes: true
          draft: false
          prerelease: false
